name: Preview

# One preview stage per pull request: pr-<number> on finance-pr-<number>.ar7al.dev.
# Deployed on open, push, reopen and ready-for-review (draft pull requests are skipped); destroyed when the pull request closes (merged or not).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

# One group per pull request. A newer push cancels an older deploy; teardown is never cancelled
# because the closed event runs in the same group after any deploy in flight.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read
  pull-requests: write

env:
  STAGE: pr-${{ github.event.pull_request.number }}
  WEB_URL: https://finance-pr-${{ github.event.pull_request.number }}.ar7al.dev
  API_URL: https://finance-pr-${{ github.event.pull_request.number }}-api.ar7al.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_PREVIEW }}
  ALCHEMY_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    name: Deploy preview
    # Fork pull requests get no secrets, so they cannot deploy. Drafts do not deploy either.
    if: >-
      github.event.action != 'closed' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run test

      - name: Deploy stage
        id: deploy
        working-directory: packages/infra
        run: |
          set -o pipefail
          bun run deploy:preview --stage "$STAGE" 2>&1 | tee deploy.log
        continue-on-error: true

      - name: Explain the D1 database limit
        if: steps.deploy.outcome == 'failure'
        working-directory: packages/infra
        run: |
          if grep -qiE "maximum number of databases|database limit|7406" deploy.log; then
            echo "::error::Cloudflare refused to create the D1 database: the free plan allows 10 databases per account. Close stale pull requests (their previews are destroyed on close) and re-run this job."
          fi
          exit 1

      - name: Comment URLs on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- attijariflare-preview -->";
            const body = [
              marker,
              "Preview deployed for stage `" + process.env.STAGE + "`.",
              "",
              "| | URL |",
              "| --- | --- |",
              "| Web | " + process.env.WEB_URL + " |",
              "| API | " + process.env.API_URL + " |",
              "",
              "Commit " + context.payload.pull_request.head.sha + ". The stage is destroyed when this pull request closes.",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === "Bot" && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  destroy:
    name: Destroy preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Destroy stage
        working-directory: packages/infra
        run: bun run destroy:preview --stage "$STAGE"

      - name: Update the pull request comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- attijariflare-preview -->";
            const body = marker + "\nPreview stage `" + process.env.STAGE + "` was destroyed when this pull request closed.";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === "Bot" && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }
